name: Latest Build

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Prepare asset
        run: |
          JAR=$(find target -maxdepth 1 -name "sync-*.jar" ! -name "*original*" | head -n1)
          cp "$JAR" AstralisSync-latest.jar

      - name: Update "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automated staging build of commit ${{ github.sha }}.
          Download \`AstralisSync-latest.jar\` below. May be unstable."
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest AstralisSync-latest.jar \
            --prerelease --title "Latest (staging)" --notes "$NOTES"

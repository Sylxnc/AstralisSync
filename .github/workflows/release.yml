name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Prepare release asset
        run: |
          JAR=$(find target -maxdepth 1 -name "sync-*.jar" ! -name "*original*" | head -n1)
          cp "$JAR" "AstralisSync-${{ github.ref_name }}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AstralisSync-${{ github.ref_name }}.jar
          generate_release_notes: true
